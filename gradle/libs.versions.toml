[versions]
kotlin = "2.3.20"
coroutines = "1.10.2"
serialization = "1.9.0"
junit = "5.11.4"
okhttp = "5.1.0"
openai = "4.51.0"
anthropic = "2.54.0"
google-genai = "1.66.0"
aws-kotlin = "1.8.31"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
openai-java = { module = "com.openai:openai-java", version.ref = "openai" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }
google-genai = { module = "com.google.genai:google-genai", version.ref = "google-genai" }
aws-bedrockruntime = { module = "aws.sdk.kotlin:bedrockruntime", version.ref = "aws-kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
